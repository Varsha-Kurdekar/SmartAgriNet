<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Plant Disease Detection</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f4f7f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container{
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h1{
            color: #2e7d32;
            margin-bottom: 20px;
        }

        input[type="file"]{
            margin: 20px 0;
        }

        button{
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #1b5e20;
        }

        .result{
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            color: #1b5e20;
            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🌿 Plant Disease Detection</h1>

        <form action="{{ url_for('disease_page.predict') }}"
              method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="image"
                   required>

            <br>

            <button type="submit">
                Predict Disease
            </button>

        </form>

        {% if prediction %}

        <div class="result">

            Prediction: {{ prediction }}

        </div>

        {% endif %}

    </div>

</body>

</html>
