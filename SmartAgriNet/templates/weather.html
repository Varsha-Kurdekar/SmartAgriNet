<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet"
          href="{{ url_for('weather_page.static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h2>☁️ Weather App</h2>

        <input type="text"
               id="cityInput"
               placeholder="Enter city">

        <button onclick="searchTemperature()">
            Search
        </button>

        <h1 id="temp">--°C</h1>

        <h2 id="city">City</h2>

        <p id="weather">Condition</p>

        <img id="icon">

    </div>

    <script src="{{ url_for('weather_page.static',
                            filename='script.js') }}">
    </script>

</body>

</html>
